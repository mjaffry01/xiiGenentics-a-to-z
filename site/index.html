<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genetics lecture</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home">
  <header class="home-head">
    <p class="eyebrow">Class 6 curiosity to the medical entrance</p>
    <h1>Genetics</h1>
    <p class="lede">A spoken lecture at 160 words a minute, with the diagrams moving as the idea is said. A female voice and a male voice take turns. Then the same path can be studied one idea at a time.</p>
    <p><a class="study-link" href="learn.html">Study one idea at a time</a></p>
  </header>
  <main>
    <figure class="player">
      <video id="lecture" controls playsinline preload="metadata" src="../lecture/genetics-lecture.mp4">
        Your browser cannot play this video. The file is lecture/genetics-lecture.mp4.
      </video>
      <figcaption>Sonia and Ryan, clear British English. About 17 minutes. Subtitles are on the picture.</figcaption>
    </figure>
    <h2>Jump to an idea</h2>
    <div class="chapters" id="chapters"></div>
  </main>
  <script>
    const chapters = [
      [0, "Opening"],
      [17, "A mango seed"],
      [42, "Same family, not copies"],
      [72, "The message is not paint"],
      [107, "Two copies"],
      [140, "One copy can hide the other"],
      [176, "The quiet copy returns"],
      [212, "The test cross"],
      [252, "Two characters, and the percent"],
      [295, "When neither copy simply wins"],
      [353, "Chromosomes and linkage"],
      [408, "Who decides the sex"],
      [463, "Four letters"],
      [520, "Three experiments"],
      [572, "The ladder copies"],
      [624, "Reading a protein"],
      [705, "A chapter can stay shut"],
      [763, "A changed letter"],
      [836, "Count the crowd"],
      [892, "Why the count changes"],
      [950, "Deep time"]
    ];
    const video = document.getElementById("lecture");
    const box = document.getElementById("chapters");
    chapters.forEach(([seconds, label]) => {
      const button = document.createElement("button");
      button.type = "button";
      const min = Math.floor(seconds / 60);
      const sec = String(seconds % 60).padStart(2, "0");
      button.textContent = min + ":" + sec + "  " + label;
      button.addEventListener("click", () => {
        video.currentTime = seconds;
        video.play();
      });
      box.appendChild(button);
    });
  </script>
</body>
</html>
